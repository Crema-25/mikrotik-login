<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 160" role="img" aria-labelledby="title desc">
  <title id="title">Zanoon</title>
  <desc id="desc">Logo sombre et violet de Zanoon, avec monogramme Z et aura abstraite.</desc>
  <defs>
    <linearGradient id="violet" x1="26" y1="18" x2="126" y2="134" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9D5FF"/>
      <stop offset=".34" stop-color="#B56CFF"/>
      <stop offset=".72" stop-color="#7C2DDB"/>
      <stop offset="1" stop-color="#421073"/>
    </linearGradient>
    <linearGradient id="edge" x1="36" y1="27" x2="119" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8B4FE"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop stop-color="#A855F7" stop-opacity=".46"/>
      <stop offset=".48" stop-color="#7E22CE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#581C87" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 .28  0 0.45 0 0 .02  0 0 1 0 .5  0 0 0 .85 0" result="purple"/>
      <feMerge><feMergeNode in="purple"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Abstract shadow aura: original geometry, no external assets. -->
  <circle cx="80" cy="80" r="67" fill="url(#aura)"/>
  <path d="M31 77C43 38 72 19 111 23M25 95c21 37 56 47 96 28M46 132c31 15 61 3 82-20" fill="none" stroke="#8B35E8" stroke-width="2" stroke-linecap="round" opacity=".36"/>
  <path d="M35 54c-10 17-11 37-4 54M119 43c11 17 11 42 0 60" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" opacity=".48"/>

  <!-- Faceted obsidian emblem. -->
  <path d="M80 21 124 46v52l-44 41-44-41V46z" fill="#0B0711" stroke="url(#edge)" stroke-width="2"/>
  <path d="m80 21 44 25-44 16-44-16z" fill="#211132" opacity=".94"/>
  <path d="m36 98 44-36v77z" fill="#100819"/>
  <path d="m124 98-44-36v77z" fill="#170B24"/>

  <!-- The Z is a single, decisive energy stroke. -->
  <path d="M54 51h53L58 108h53" fill="none" stroke="#3B1065" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <path d="M54 48h53L58 105h53" fill="none" stroke="url(#violet)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="107" cy="48" r="3" fill="#F3E8FF"/>
  <circle cx="58" cy="105" r="2.5" fill="#D8B4FE"/>

  <!-- Wordmark: exact casing intentionally retained as Zanoon. -->
  <text x="154" y="91" fill="#F7F2FF" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="1.5">Zanoon</text>
  <path d="M158 111h78" stroke="#A855F7" stroke-width="3" stroke-linecap="round"/>
  <circle cx="247" cy="111" r="2" fill="#D8B4FE"/>
</svg>
